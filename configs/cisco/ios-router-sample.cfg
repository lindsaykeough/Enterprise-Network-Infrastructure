! SANITIZED PORTFOLIO EXAMPLE
hostname EDGE-RTR-A
ip routing
ipv6 unicast-routing

interface GigabitEthernet0/0/0
 description ROUTED-UPLINK
 ip address 10.255.0.1 255.255.255.252
 no shutdown

interface GigabitEthernet0/0/1.1301
 encapsulation dot1Q 1301
 ip address 10.10.1.2 255.255.255.0
 ip ospf 1 area 10
 standby 301 ip 10.10.1.1
 standby 301 priority 110
 standby 301 preempt
 ip helper-address 10.20.0.10

router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface GigabitEthernet0/0/0

ip domain name lab.example
ip name-server 192.0.2.53
ntp server 192.0.2.10
