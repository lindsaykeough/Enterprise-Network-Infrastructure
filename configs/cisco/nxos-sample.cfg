! SANITIZED PORTFOLIO EXAMPLE
feature ospf
feature ospfv3
feature interface-vlan

interface Ethernet1/49
 description WAN-UPLINK
 no switchport
 ip address 198.51.100.2/30
 ipv6 address 2001:db8:100::2/64
 no shutdown

interface Ethernet1/1
 description DOWNSTREAM-L3
 no switchport
 ip address 10.255.0.1/30
 ipv6 address 2001:db8:10::1/64
 no shutdown

router ospf 1
 router-id 11.11.11.11
router ospfv3 1
 router-id 11.11.11.11

interface Ethernet1/49
 ip router ospf 1 area 0.0.0.0
 ipv6 router ospfv3 1 area 0.0.0.0
